    <!-- Fonts -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#111111',
                        'secondary': '#141414',
                        'surface': '#1E1E1E',
                        'walnut': '#6B4F3A',
                        'beige': '#D6C2A8',
                        'gold': '#B89B72',
                        'text-primary': '#F5F1EA',
                        'text-secondary': '#A8A29E',
                    },
                    fontFamily: {
                        'serif': ['"Cormorant Garamond"', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1s ease-out forwards',
                        'fade-in': 'fadeIn 1.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }

    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="assets/css/shared.css">

    <style>
        h1, h2, h3, h4 {
            font-family: "Cormorant Garamond", serif;
        }
    </style>
</head>
<body class="bg-primary text-text-primary font-sans antialiased selection:bg-walnut selection:text-white overflow-x-hidden">

    <!-- Navbar -->
    <header id="navbar" class="fixed top-0 left-0 w-full z-50 transition-all duration-500 py-6">
        <!-- Injected via components.js -->
    </header>

    <main>
        <!-- Hero Section -->
        <section class="relative h-[60vh] w-full flex items-center justify-center overflow-hidden">
            <div class="absolute inset-0 z-0">
                <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2000" alt="Connect with LJP Studio" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-primary/60"></div>
            </div>
            <div class="container mx-auto px-6 lg:px-12 relative z-10 text-center">
                <span class="inline-block text-[10px] uppercase tracking-[0.4em] text-walnut mb-6 animate-fade-in">Connect</span>
                <h1 class="text-5xl md:text-7xl font-serif mb-12 animate-fade-in-up">Let's build your <br> <span class="italic text-gold">Dream Space</span></h1>
            </div>
        </section>

        <section class="py-20">
            <div class="container mx-auto px-6 lg:px-12">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-20">
                    <!-- Contact Info -->
                    <div class="reveal">
                        
                        <div class="space-y-12">
                            <div>
                                <span class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">General Inquiry</span>
                                <a href="mailto:hello@ljpstudio.com" class="text-2xl hover:text-walnut transition-colors">hello@ljpstudio.com</a>
                            </div>
                            <div>
                                <span class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">WhatsApp</span>
                                <a href="https://wa.me/6281234567890" class="text-2xl hover:text-walnut transition-colors">+62 812 3456 7890</a>
                            </div>
                            <div>
                                <span class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">Our Studio</span>
                                <p class="text-xl text-text-secondary">Jl. Walnut Residence No. 88, <br> South Jakarta, Indonesia</p>
                            </div>
                        </div>

                        <div class="mt-20 flex space-x-8">
                            <a href="#" class="text-[10px] uppercase tracking-widest hover:text-walnut">Instagram</a>
                            <a href="#" class="text-[10px] uppercase tracking-widest hover:text-walnut">Facebook</a>
                            <a href="#" class="text-[10px] uppercase tracking-widest hover:text-walnut">LinkedIn</a>
                        </div>
                    </div>

                    <!-- Inquiry Form -->
                    <div class="bg-secondary p-8 lg:p-16 border border-white/5 reveal" style="transition-delay: 200ms">
                        <h2 class="text-3xl font-serif mb-12">Send an Inquiry</h2>
                        <form action="#" class="space-y-8">
                            <div>
                                <label class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">Full Name</label>
                                <input type="text" placeholder="John Doe" class="w-full bg-transparent border-b border-white/10 py-4 focus:border-walnut outline-none transition-colors text-sm placeholder:text-text-secondary/30">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <label class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">Email Address</label>
                                    <input type="email" placeholder="john@example.com" class="w-full bg-transparent border-b border-white/10 py-4 focus:border-walnut outline-none transition-colors text-sm placeholder:text-text-secondary/30">
                                </div>
                                <div>
                                    <label class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">Phone Number</label>
                                    <input type="tel" placeholder="+62 ..." class="w-full bg-transparent border-b border-white/10 py-4 focus:border-walnut outline-none transition-colors text-sm placeholder:text-text-secondary/30">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">Project Type</label>
                                <select class="w-full bg-transparent border-b border-white/10 py-4 focus:border-walnut outline-none transition-colors text-sm placeholder:text-text-secondary/30 bg-secondary">
                                    <option>Kitchen Set</option>
                                    <option>Bedroom Suite</option>
                                    <option>Living Room</option>
                                    <option>Office & Studio</option>
                                    <option>Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] uppercase tracking-widest text-text-secondary mb-2 block">Message</label>
                                <textarea rows="4" placeholder="Tell us about your project..." class="w-full bg-transparent border-b border-white/10 py-4 focus:border-walnut outline-none transition-colors text-sm placeholder:text-text-secondary/30 resize-none"></textarea>
                            </div>
                            <button type="submit" class="w-full py-4 bg-walnut text-text-primary uppercase text-xs tracking-widest hover:bg-gold transition-colors">Send Inquiry</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Map/Location reveal -->
        <section class="py-20 reveal">
            <div class="container mx-auto px-6 lg:px-12">
                <div class="aspect-[21/9] bg-surface overflow-hidden grayscale">
                    <img src="https://images.unsplash.com/photo-1524666041070-9d87656c25bb?auto=format&fit=crop&q=80&w=2000" alt="LJP Studio Custom Furniture Location Map in South Jakarta" loading="lazy" class="w-full h-full object-cover">
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-primary pt-32 pb-12 border-t border-white/5">
        <!-- Injected via components.js -->
    </footer>

    <!-- Scripts -->
    <script src="assets/js/components.js"></script>
    <script>
        // Lenis Smooth Scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);

        // Navbar Scroll Effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('glass-nav', 'py-4');
                navbar.classList.remove('py-6');
            } else {
                navbar.classList.remove('glass-nav', 'py-4');
                navbar.classList.add('py-6');
            }
        });

        // Intersection Observer for Reveal
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal-active');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>
</html>
